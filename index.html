body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 0%,#52d8f022,transparent 45%),radial-gradient(ellipse at 5% 90%,#ffbd4d18,transparent 42%);z-index:-1}
.bubble{position:fixed;bottom:-50px;border:1px solid #93eaf4aa;border-radius:50%;box-shadow:inset -3px -3px 8px #8ad1e933;opacity:.22;pointer-events:none;animation:float var(--spd) linear infinite;left:var(--pos);width:var(--sz);height:var(--sz);z-index:0}@keyframes float{to{transform:translateY(-115vh) translateX(25px)}}
.shell{position:relative;max-width:1130px;margin:auto;padding:22px 18px 45px;z-index:2}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:13px}.logo{width:61px;height:61px;display:grid;place-items:center;font-size:32px;border:2px solid #ffdb79;border-radius:20px;background:linear-gradient(145deg,#155777,#081e36);box-shadow:0 6px 24px #05111b}
.brand b{font-size:clamp(18px,3vw,28px);color:#fff0be}.brand small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tool{font:inherit;border:1px solid #ffffff36;background:#163e5bcc;color:#fff;border-radius:13px;padding:10px 14px;cursor:pointer;transition:.2s}.tool:hover,.tool:focus-visible{background:#286487;transform:translateY(-2px)}
.deck{border:2px solid #f0be69aa;border-radius:28px;padding:clamp(18px,3vw,32px);background:linear-gradient(150deg,#103d61ee,#082a4beb 70%);box-shadow:0 18px 55px #020e1dbb,inset 0 1px 0 #bbffff40;position:relative;overflow:hidden}
.deck:before{content:"";position:absolute;inset:7px;border:1px solid #fff6ad24;border-radius:22px;pointer-events:none}.deck>*{position:relative}
.hero{display:grid;grid-template-columns:1.3fr .7fr;align-items:center;gap:22px;min-height:315px}.eyebrow{letter-spacing:.06em;color:#bdf3f2;font-weight:900;font-size:14px}.big{font-size:clamp(31px,5vw,58px);line-height:1.2;margin:12px 0;color:#ffe0a5;text-shadow:0 5px 0 #0a2338,0 0 24px #ffb74b40}.lead{font-size:clamp(16px,2.15vw,21px);color:#d2edf6;line-height:1.9;margin:0 0 20px}.globe{min-height:260px;display:grid;place-items:center;position:relative}.globe .earth{font-size:clamp(100px,14vw,160px);filter:drop-shadow(0 10px 15px #0015);animation:drift 5s ease-in-out infinite}.globe .sub{position:absolute;font-size:clamp(75px,10vw,113px);transform:rotate(-13deg) translate(-35px,40px);filter:drop-shadow(0 7px 7px #001);animation:swim 5s ease-in-out infinite}.globe .turtle{position:absolute;top:20px;right:1%;font-size:42px}.globe .fish{position:absolute;bottom:12px;left:5%;font-size:35px}@keyframes drift{50%{transform:translateY(-8px)}}@keyframes swim{50%{transform:rotate(-10deg) translate(-20px,24px)}}
fieldset{border:0;margin:0;padding:0}.fieldlabel{display:block;color:#e8fcff;font-weight:800;margin:12px 0 7px}.field{width:100%;background:#e9fbff;color:#092b47;border:2px solid #aadceb;border-radius:12px;padding:12px 14px;font:700 17px inherit;outline:none}.field:focus{border-color:#ffc45c;box-shadow:0 0 0 3px #ffc45c44}.name-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:630px}.option-row{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 20px}.togglecheck{display:flex;align-items:center;gap:8px;color:#e8f7ff;cursor:pointer}.togglecheck input{width:17px;height:17px;accent-color:#ffcc65}
.btn{font:800 18px inherit;background:linear-gradient(180deg,#ffdf88,#ffae4f);color:#06243a;border:2px solid #ffe9b4;border-radius:15px;padding:13px 22px;box-shadow:0 6px 0 #8c4a0b,0 10px 24px #0003;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:51px}.btn:hover{filter:brightness(1.09);transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #8c4a0b}.btn:disabled{cursor:not-allowed;opacity:.55;box-shadow:none}.btn.alt{color:#e8fcff;background:linear-gradient(180deg,#2a688c,#114368);border-color:#7fdcff;box-shadow:0 6px 0 #09283d}.btn.ghost{color:#d4edf9;background:#0d354e;border:1px solid #9bc7e966;box-shadow:none}.btn.small{font-size:15px;padding:9px 13px;min-height:40px}
.hud{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:14px}.hudcard{background:#0e3c5bd9;border:1px solid #8dbad458;border-radius:15px;padding:10px 15px;min-width:105px;text-align:center}.hudcard strong{font-size:24px;color:#ffda83}.hudcard span{display:block;font-size:12px;color:var(--muted)}
.progress{height:15px;border-radius:20px;background:#0b1f38;border:1px solid #72aed45b;overflow:hidden;margin-bottom:22px}.bar{height:100%;width:0;background:linear-gradient(90deg,#5ee9d9,#b0e795,#ffd36d);border-radius:inherit;transition:width .3s}
.levelmark{display:inline-block;background:#164d6d;border:1px solid #5acfc6;color:#bbffee;border-radius:50px;padding:5px 12px;font-size:13px;font-weight:800}.stage-title{font-size:clamp(23px,3.6vw,37px);color:#ffe1a2;margin:10px 0}.stage-desc{color:#d4eff5;line-height:1.8;margin:8px 0 20px;font-size:17px}.challenge{border:1px solid #bfe4f764;background:linear-gradient(160deg,#edfafffc,#cdebf9f7);color:#0b3150;border-radius:21px;padding:clamp(14px,3vw,27px);min-height:200px;box-shadow:inset 0 3px 12px #fff7}.challenge .qtag{font-weight:900;color:#15608c;font-size:14px}.challenge h3{font-size:clamp(20px,2.6vw,28px);line-height:1.7;margin:8px 0 15px;color:#073653}.hint{font-size:13px;color:#2e5671;margin:9px 0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:13px 0 3px}.choice{font:800 clamp(15px,2vw,21px) inherit;color:#0d3b55;border:2px solid #b3d8ea;background:#f9feff;border-radius:13px;padding:14px 10px;min-height:62px;cursor:pointer;transition:.15s;box-shadow:0 3px 0 #c2d1dc}.choice:hover{border-color:#399bba;transform:translateY(-2px)}.choice.chosen{border-color:#f1aa32;background:#fff4ce;box-shadow:0 0 0 3px #ffd26d77}
.days{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.day{border:1px solid #7cbde4;background:#fff;border-radius:13px;padding:13px 15px;color:#16415f;font:800 17px inherit;cursor:pointer;min-width:92px}.day:disabled{opacity:.3;cursor:not-allowed}.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:64px;padding:10px;border:2px dashed #6eb5ce;border-radius:12px;background:#d1ecf266;margin-top:14px}.slot{min-width:85px;background:#23709b;color:white;padding:12px 6px;text-align:center;border-radius:9px;font-weight:900}.empty{min-width:77px;padding:12px 6px;text-align:center;border:1px dashed #7cbbc7;border-radius:9px;color:#6092a9;font-weight:700}
.num-input{max-width:240px;text-align:center;font-size:27px;font-weight:900;direction:ltr;display:block;margin:14px auto;background:#fff;color:#0b3859;border:2px solid #80bcd7;border-radius:14px;padding:12px}.age-inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:550px;margin:15px auto}.age-inputs label{text-align:center;font-weight:900;color:#164964}.age-inputs input{margin-top:7px;width:100%;text-align:center;background:white;color:#0b3859;border:2px solid #92bdcc;border-radius:11px;padding:12px;font-size:23px;font-weight:900}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));max-width:580px;margin:16px auto;gap:4px;direction:rtl}.calhead{background:#0b4d73;color:#fff;text-align:center;padding:10px 1px;border-radius:8px;font-size:clamp(10px,1.5vw,15px);font-weight:900}.calblank{min-height:47px}.calday{background:#fff;border:1px solid #a4d0e6;border-radius:8px;min-height:49px;cursor:pointer;color:#114663;font-size:18px;font-weight:900}.calday:hover{background:#cff2f4}.calday.sel{background:#ffd57a;border:2px solid #f19e22}.calday:focus-visible,.choice:focus-visible,.day:focus-visible{outline:3px solid #fc9d32}
.feedback{margin:14px 0;border-radius:15px;padding:13px 18px;line-height:1.8;font-weight:800;border:1px solid transparent}.feedback.good{background:#174b46;color:#c8ffdf;border-color:#7be5ab}.feedback.warn{background:#66501d;color:#fff3d4;border-color:#ffd27a}.feedback.fail{background:#652c43;color:#ffe1e5;border-color:#ff9cad}.actionstrip{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;margin-top:18px}.subtext{font-size:14px;color:#a6d9df;text-align:center;margin-top:20px}
.station-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:21px 0}.station{padding:13px 6px;text-align:center;border:1px solid #79b4cf55;background:#0a2944b9;border-radius:13px;font-size:12px;color:#9cc8dd}.station span{display:block;font-size:23px;margin-bottom:6px}.station.done{background:#206253;color:#dbffdf;border-color:#6de2a9}.station.active{background:#244a6c;border-color:#ffd580;color:#ffe7ae}
.guideheader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 8px}.guidecopy{flex:1;text-align:center}.guidecopy .stage-title{margin:4px 0}.guidecopy .stage-desc{margin:3px 0 8px}.avatar{width:96px;height:96px;object-fit:cover;flex-shrink:0;border-radius:50%;border:3px solid #ffe19c;box-shadow:0 7px 16px #0007;background:#165875}.trophy{text-align:center;padding:35px 10px}.trophy .ticon{font-size:90px;filter:drop-shadow(0 7px 14px #0006)}.trophy h1{font-size:36px;color:#ffe09e;margin-bottom:8px}.trophy p{font-size:18px;line-height:2}.scores{display:flex;justify-content:center;flex-wrap:wrap;gap:13px;margin:18px 0}.scorecard{border:1px solid #ffdc8c;background:#123e5b;border-radius:15px;padding:17px 24px;min-width:180px;text-align:center}.scorecard b{display:block;font-size:35px;color:#ffda86}
.notification{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:#07283b;color:white;border:1px solid #e7cc7e;padding:12px 20px;border-radius:13px;z-index:10;box-shadow:0 8px 24px #0008}
.underfoot{color:#b1d9e6;text-align:center;margin:15px 0;font-size:13px}.underfoot b{color:#ffd988}

<body>
<div id="ambient"></div>
<div class="shell">
  <header class="top">
   <div class="brand"><span class="logo" aria-hidden="true">🚢</span><div><b>غواصة أسرار التقويم</b><small>رياضيات الصف السادس · الوحدة الثانية: القياس</small></div></div>
   <div class="toolbar"><button class="tool" id="soundToggle" aria-label="التحكم بالصوت">🔊 الأصوات: تعمل</button><button class="tool" id="speakToggle" aria-label="التحكم بالنطق">🎙️ النطق: متوقف</button><button class="tool" id="homeBtn">↻ البداية</button></div>
  </header>

  <footer class="underfoot"><b>لؤلؤة عُمان</b> · لعبة تعليمية تفاعلية تعمل دون اتصال بالإنترنت · تصحيح بعد المحاولة الثانية</footer>
</div>
<script>
'use strict';
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=n=>String(n).replace(/\d/g,ch=>AR[ch]);
const parseNum=s=>{const v=String(s??'').replace(/[٠-٩]/g,c=>AR.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).trim();return v===''?NaN:Number(v)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>a.map(x=>({x,k:Math.random()})).sort((a,b)=>a.k-b.k).map(o=>o.x);
const DOW=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTH=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const CLASS={'يناير':'٣١ يومًا','أبريل':'٣٠ يومًا','فبراير':'٢٨ أو ٢٩ يومًا','أغسطس':'٣١ يومًا','نوفمبر':'٣٠ يومًا','سبتمبر':'٣٠ يومًا','مارس':'٣١ يومًا','ديسمبر':'٣١ يومًا'};
const STAGES=[
 {icon:'🗓️',name:'بوابة أيام الأسبوع',short:'ترتيب الأيام',desc:'رتّبي أيام الأسبوع من الأحد إلى السبت لفتح بوابة الغواصة.',type:'order',items:[{q:'المسي البطاقات بالترتيب الصحيح، بدءًا من الأحد.',answer:DOW.join('|'),explain:'يبدأ التسلسل هنا بالأحد، ثم الاثنين، الثلاثاء، الأربعاء، الخميس، الجمعة، السبت.'}]},
 {icon:'🐚',name:'خزائن الشهور',short:'تصنيف الشهور',desc:'وجّهي كل شهر إلى الصندوق الذي يطابق عدد أيامه.',type:'category',items:Object.entries(CLASS).map(([month,answer])=>({q:`كم يومًا في شهر ${month}؟`,answer,explain:month==='فبراير'?'يتكوّن فبراير من ٢٨ يومًا في السنة العادية و٢٩ في السنة الكبيسة.':`${month} يحتوي على ${answer}.`}))},
 {icon:'✨',name:'مختبر السنة الكبيسة',short:'سرّ فبراير',desc:'اكتشفي السَّنوات التي تحتوي على ٢٩ يومًا في فبراير.',type:'leap',items:[{q:'هل سنة ٢٠٢٤ كبيسة؟',answer:'نعم',explain:'٢٠٢٤ تقبل القسمة على ٤، وهي ليست سنة مئوية؛ إذن هي كبيسة.'},{q:'هل سنة ٢٠٢٣ كبيسة؟',answer:'لا',explain:'٢٠٢٣ لا تقبل القسمة على ٤؛ فبراير فيها ٢٨ يومًا.'},{q:'هل سنة ٢٠٠٠ كبيسة؟',answer:'نعم',explain:'٢٠٠٠ سنة مئوية تقبل القسمة على ٤٠٠؛ إذن هي كبيسة.'},{q:'هل سنة ٢١٠٠ كبيسة؟',answer:'لا',explain:'السنوات المئوية لا تكون كبيسة إلا إذا قبلت القسمة على ٤٠٠.'},{q:'هل سنة ٢٠٢٨ كبيسة؟',answer:'نعم',explain:'٢٠٢٨ تقبل القسمة على ٤ وليست سنة مئوية؛ إذن هي كبيسة.'}]},
 {icon:'⚙️',name:'جسر تحويل الزمن',short:'وحدات متكافئة',desc:'اكتبي العدد الصحيح لتمر الغواصة من جسر الوحدات.',type:'number',items:[{q:'٣ أسابيع = كم يومًا؟',answer:21,unit:'يومًا',explain:'٣ × ٧ = ٢١ يومًا.'},{q:'٤٨ ساعة = كم يومًا؟',answer:2,unit:'يوم',explain:'٤٨ ÷ ٢٤ = يومان.'},{q:'٤ عقود = كم سنة؟',answer:40,unit:'سنة',explain:'٤ × ١٠ = ٤٠ سنة.'},{q:'قرنان = كم سنة؟',answer:200,unit:'سنة',explain:'٢ × ١٠٠ = ٢٠٠ سنة.'},{q:'٣ سنوات = كم شهرًا؟',answer:36,unit:'شهرًا',explain:'٣ × ١٢ = ٣٦ شهرًا.'},{q:'٥ أيام = كم ساعة؟',answer:120,unit:'ساعة',explain:'٥ × ٢٤ = ١٢٠ ساعة.'}]},
 {icon:'🔍',name:'لغز التقويم المفقود',short:'أغسطس ٢٠٢٣',desc:'اقرئي تقويم أغسطس ٢٠٢٣، ثم حددي التواريخ المطلوبة بلمسة واحدة.',type:'calendar',items:[{q:'ما التاريخ الموافق ليوم الجمعة الثالثة في أغسطس ٢٠٢٣؟',answer:18,explain:'الجُمع في هذا الشهر: ٤، ١١، ١٨، ٢٥؛ الثالثة توافق ١٨ أغسطس.'},{q:'ما تاريخ الجمعة السابقة ليوم ١٨ أغسطس؟',answer:11,explain:'١٨ − ٧ = ١١ أغسطس.'},{q:'ما تاريخ الجمعة التالية ليوم ١٨ أغسطس؟',answer:25,explain:'١٨ + ٧ = ٢٥ أغسطس.'}]},
 {icon:'🧭',name:'مسار الرحلات',short:'تقدّمي على التقويم',desc:'احسبي تواريخ الوصول باستخدام الزمن المنقضي، ولا تحسبي يوم الانطلاق ضمن الأيام المُضافة.',type:'options',items:[{q:'انطلقت رحلة في ٦ نوفمبر. ما التاريخ بعد أسبوع واحد؟',opts:['١٢ نوفمبر','١٣ نوفمبر','١٤ نوفمبر','١٥ نوفمبر'],answer:'١٣ نوفمبر',explain:'الأسبوع = ٧ أيام؛ ٦ + ٧ = ١٣ نوفمبر.'},{q:'بدأ نشاط يوم ٢٧ أبريل. ما تاريخ نهاية ٦ أيام منقضية؟',opts:['١ مايو','٢ مايو','٣ مايو','٤ مايو'],answer:'٣ مايو',explain:'٢٨، ٢٩، ٣٠ أبريل ثم ١، ٢، ٣ مايو = ٦ أيام.'},{q:'انطلقت رحلة يوم ٢٠ يوليو واستمرت أسبوعين و٣ أيام. ما تاريخ العودة؟',opts:['٥ أغسطس','٦ أغسطس','٧ أغسطس','٨ أغسطس'],answer:'٦ أغسطس',explain:'١٤ + ٣ = ١٧ يومًا بعد ٢٠ يوليو؛ العودة ٦ أغسطس.'},{q:'كم يومًا مضى من ٢٨ مايو إلى ٥ يونيو؟',opts:['٧ أيام','٨ أيام','٩ أيام','١٠ أيام'],answer:'٨ أيام',explain:'٢٩ و٣٠ و٣١ مايو = ٣ أيام؛ ومن ١ إلى ٥ يونيو = ٥ أيام؛ المجموع ٨.'}]},
 {icon:'🧮',name:'سجل الأعمار البحرية',short:'سنوات وشهور وأيام',desc:'اكتبي العمر الكامل بالسنوات والشهور والأيام. تحققي من عدد أيام الشهر عند الاستعارة.',type:'age',items:[{q:'وُلد سالم في ٢٤ أغسطس ٢٠٠٣. كم عمره في ٣٠ نوفمبر ٢٠١٨؟',answer:[15,3,6],explain:'٣٠−٢٤=٦ أيام، ١١−٨=٣ أشهر، ٢٠١٨−٢٠٠٣=١٥ سنة.'},{q:'وُلد أحمد في ١١ يونيو ٢٠٠٧. كم عمره في ١٨ نوفمبر ٢٠١٨؟',answer:[11,5,7],explain:'١٨−١١=٧ أيام، ١١−٦=٥ أشهر، ٢٠١٨−٢٠٠٧=١١ سنة.'},{q:'وُلد جابر في ١١ يوليو ٢٠١٣. كم عمره في ٣١ أكتوبر ٢٠١٨؟',answer:[5,3,20],explain:'٣١−١١=٢٠ يومًا، ١٠−٧=٣ أشهر، ٢٠١٨−٢٠١٣=٥ سنوات.'},{q:'وُلد طفل في ٢٥ سبتمبر ٢٠١٢. كم عمره في ١٨ أغسطس ٢٠٢٣؟',answer:[10,10,24],explain:'نستعير من يوليو ٣١ يومًا؛ ١٨+٣١−٢٥=٢٤ يومًا، ثم ١٠ أشهر و١٠ سنوات.'}]},
 {icon:'🕵️',name:'صيّادة الأخطاء',short:'صحّحي العبارات',desc:'اكشفي الخطأ الأخير في سجل الزمن، ثم افتحي بوابة الكنـز.',type:'options',items:[{q:'كتبت إحدى الطالبات: ٤ قرون و٣ عقود = ٣٤ سنة. ما التصحيح؟',opts:['٣٤ سنة','٤٣ سنة','٣٤٠ سنة','٤٣٠ سنة'],answer:'٤٣٠ سنة',explain:'٤ قرون = ٤٠٠ سنة، و٣ عقود = ٣٠ سنة؛ المجموع ٤٣٠.'},{q:'ما التصحيح لعبارة «شهر فبراير ٢٠٢٤ فيه ٢٨ يومًا»؟',opts:['٢٩ يومًا','٣٠ يومًا','٣١ يومًا','العبارة صحيحة'],answer:'٢٩ يومًا',explain:'سنة ٢٠٢٤ كبيسة، فيكون فبراير ٢٩ يومًا.'},{q:'ما التصحيح لعبارة «٣ أسابيع = ١٤ يومًا»؟',opts:['١٧ يومًا','٢١ يومًا','٢٨ يومًا','٧ أيام'],answer:'٢١ يومًا',explain:'٣ × ٧ = ٢١ يومًا.'},{q:'ما التصحيح لعبارة «نصف قرن = ٥ سنوات»؟',opts:['٥٠ سنة','١٠ سنوات','٢٠ سنة','١٠٠ سنة'],answer:'٥٠ سنة',explain:'القرن = ١٠٠ سنة، ونصفه = ٥٠ سنة.'}]}
];
const TOTAL=STAGES.reduce((s,st)=>s+st.items.length,0);
const app=document.getElementById('app');
const state={view:'welcome',stage:0,question:0,done:0,attempts:0,selected:null,order:[],status:'',message:'',complete:false,teams:['مستكشف الزمن'],scores:[0],dual:false,started:0,elapsed:0,sound:true,speech:false,finished:false};
let ticker=null,ctx=null;
function tone(kind){if(!state.sound)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let notes=kind==='win'?[523,659,784]:kind==='level'?[440,554,659,880]:[280,245];notes.forEach((hz,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),at=ctx.currentTime+i*.115;o.type=kind==='error'?'triangle':'sine';o.frequency.setValueAtTime(hz,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.12,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+.16);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+.18)})}catch(e){}}
function speak(s){if(!state.speech||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ar';u.rate=.94;u.pitch=1.1;let voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ar'));u.voice=voices.find(v=>/female|woman|zira|salma|amira|laila|hoda/i.test(v.name))||voices[0]||null;speechSynthesis.speak(u)}catch(e){}}
function notify(msg){const d=document.createElement('div');d.className='notification';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function timeFormat(t){const m=Math.floor(t/60),s=t%60;return `${ar(String(m).padStart(2,'0'))}:${ar(String(s).padStart(2,'0'))}`}
function shell(content){app.innerHTML=content;document.getElementById('soundToggle').textContent=state.sound?'🔊 الأصوات: تعمل':'🔇 الأصوات: متوقفة';document.getElementById('speakToggle').textContent=state.speech?'🎙️ النطق: يعمل':'🎙️ النطق: متوقف';}
function bubbles(){const el=document.getElementById('ambient');el.innerHTML=Array.from({length:14},(_,i)=>`<i class="bubble" style="--pos:${i*7+2}%;--sz:${12+i%4*9}px;--spd:${11+i%5*5}s;animation-delay:-${i*1.8}s"></i>`).join('')}
function welcome(){shell(`<section class="deck hero"><div><div class="eyebrow">🌊 المهمة الكبرى · لؤلؤة عُمان</div><h1 class="big">أنقذي تقويم أعماق البحر!</h1><p class="lead">اختفت أيام الغواصة وشهورها، واختلطت تواريخ الرحلات. اجمعي <b>٨ أختام بحرية</b> في محطات تفاعلية متنوعة، وأعيدي النظام إلى سجل الزمن. 🐢</p><div class="name-grid"><div><label class="fieldlabel" for="player1">اسم المستكشفة / الفريق الأول</label><input id="player1" class="field" maxlength="24" placeholder="مثلاً: فريق اللؤلؤ" autocomplete="off"></div><div id="teamTwoField" style="display:none"><label class="fieldlabel" for="player2">اسم الفريق الثاني</label><input id="player2" class="field" maxlength="24" placeholder="فريق المرجان" autocomplete="off"></div></div><div class="option-row"><label class="togglecheck"><input type="checkbox" id="dual"> منافسة فريقين 🏆</label></div><button class="btn" data-act="start">🚀 ابدئي المغامرة</button><p class="hint" style="color:#beddeb">✅ الإجابة لا تظهر بعد الخطأ الأول · 🔈 مؤثرات صوتية · 📱 مناسبة للمس والسبورة الذكية</p></div><div class="globe"><div class="earth">🌐</div><div class="sub">🚢</div><span class="turtle">🐢</span><span class="fish">🐠</span></div></section><nav class="station-grid" aria-label="محطات المغامرة">${STAGES.map(s=>`<div class="station"><span>${s.icon}</span>${s.short}</div>`).join('')}</nav>`);document.getElementById('dual').onchange=e=>document.getElementById('teamTwoField').style.display=e.target.checked?'block':'none'}
function currentTeam(){return state.dual?state.done%2:0}
function scorePanel(){const who=currentTeam(),pct=state.done/TOTAL*100;return `<div class="hud"><div class="hudcard"><span>👩‍🚀 الدور الآن لـ</span><strong style="font-size:19px">${esc(state.teams[who])}</strong>${state.dual?`<span>${esc(state.teams[1-who])}: ${ar(state.scores[1-who])} نقطة</span>`:''}</div><div class="hudcard"><span>⭐ النقاط</span><strong>${ar(state.scores[who])}</strong></div><div class="hudcard"><span>⏱ الزمن</span><strong id="clock">${timeFormat(state.elapsed)}</strong></div></div><div class="progress" title="نسبة الإنجاز"><div class="bar" style="width:${pct}%"></div></div>`}
function renderCalendar(){let out=`<div class="calendar" aria-label="تقويم أغسطس ٢٠٢٣">${DOW.map(n=>`<div class="calhead">${n}</div>`).join('')}`;let first=new Date(Date.UTC(2023,7,1)).getUTCDay();for(let i=0;i<first;i++)out+='<div class="calblank"></div>';for(let d=1;d<=31;d++)out+=`<button type="button" class="calday ${state.selected===d?'sel':''}" data-act="date" data-val="${d}" aria-label="${ar(d)} أغسطس ٢٠٢٣">${ar(d)}</button>`;return out+'</div>'}
function challengeMarkup(st,q){let content='';const sel=state.selected;
 if(st.type==='order'){const picked=state.order;const days=state.shuffledDays||DOW;content=`<p class="hint">المسي يومًا واحدًا في كل مرة، ثم تحققي من ترتيب الصف.</p><div class="days">${days.map(d=>`<button class="day" data-act="day" data-val="${d}" ${picked.includes(d)?'disabled':''}>${d}</button>`).join('')}</div><div class="slots">${Array.from({length:7},(_,i)=>picked[i]?`<div class="slot">${picked[i]}</div>`:`<div class="empty">${ar(i+1)}</div>`).join('')}</div><div class="actionstrip"><button class="btn ghost small" data-act="undo">↶ تراجع</button><button class="btn ghost small" data-act="clear">مسح الترتيب</button></div>`}
 if(st.type==='category'||st.type==='leap'||st.type==='options'){let opts=st.type==='category'?['٣١ يومًا','٣٠ يومًا','٢٨ أو ٢٩ يومًا']:st.type==='leap'?['نعم','لا']:q.opts;content=`<div class="answers">${opts.map(x=>`<button class="choice ${sel===x?'chosen':''}" data-act="option" data-val="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}
 if(st.type==='number')content=`<label for="numeric" class="hint">اكتبي الناتج العددي فقط (${esc(q.unit)}):</label><input id="numeric" class="num-input" type="text" inputmode="numeric" pattern="[0-9٠-٩]*" autocomplete="off" placeholder="؟" value="${typeof sel==='number'?ar(sel):''}">`;
 if(st.type==='calendar')content=`<p class="hint">تقويم أغسطس ٢٠٢٣ · الأحد يظهر في العمود الأيمن.</p>${renderCalendar()}`;
 if(st.type==='age')content=`<div class="age-inputs">${['السنوات','الشهور','الأيام'].map((name,i)=>`<label>${name}<input id="age${i}" type="text" inputmode="numeric" placeholder="؟" autocomplete="off" value="${Array.isArray(sel)&&sel[i]!==undefined?ar(sel[i]):''}"></label>`).join('')}</div>`;

function isValid(q,st,chosen){if(st.type==='order')return chosen===q.answer;if(st.type==='number'||st.type==='calendar')return chosen===q.answer;if(st.type==='age')return Array.isArray(chosen)&&chosen.length===3&&chosen.every((a,i)=>a===q.answer[i]);return chosen===q.answer}
function selection(st){if(st.type==='order')return state.order.join('|');if(st.type==='number')return parseNum(document.getElementById('numeric')?.value);if(st.type==='age')return [0,1,2].map(i=>parseNum(document.getElementById('age'+i)?.value));return state.selected}
function hasResponse(st,chosen){if(st.type==='order')return state.order.length===7;if(st.type==='number')return Number.isFinite(chosen)&&chosen>=0;if(st.type==='age')return chosen.every(v=>Number.isFinite(v)&&v>=0);return chosen!==null}
function answerText(q,st){if(st.type==='order')return DOW.join(' ← ');if(st.type==='age')return `${ar(q.answer[0])} سنوات، ${ar(q.answer[1])} شهور، ${ar(q.answer[2])} أيام`;if(typeof q.answer==='number')return ar(q.answer)+(q.unit?' '+q.unit:'');return q.answer}
function verify(){if(state.complete)return;const st=STAGES[state.stage],q=st.items[state.question],chosen=selection(st);if(!hasResponse(st,chosen)){notify('أكملي الإجابة أولًا، يا مستكشفة!');tone('error');return}state.selected=chosen;const ok=isValid(q,st,chosen);state.attempts++;

 else{state.status='fail';state.message=`🔍 الحل الصحيح: ${answerText(q,st)}. ${q.explain}`;state.complete=true;tone('error');speak('تعلمي من الحل، وواصلي المغامرة!')}

function next(){const st=STAGES[state.stage];state.done++;if(state.question+1<st.items.length){state.question++;resetQuestion();renderGame();return}state.view='checkpoint';tone('level');renderCheckpoint()}
function resetQuestion(){state.attempts=0;state.selected=null;state.order=[];state.status='';state.message='';state.complete=false}
function renderCheckpoint(){const st=STAGES[state.stage];const last=state.stage===STAGES.length-1;shell(`<section class="deck trophy"><div class="ticon">${last?'🏆':'🎖️'}</div><h1>${last?'اكتمل سجل الزمن!':'حصلتِ على ختم المحطة!'}</h1><h2 style="color:#b7f6ef">${st.icon} ${st.name}</h2><p>أحسنتِ يا مستكشفة! اجتزتِ ${ar(st.items.length)} تحديات في هذه المحطة. <br>أنجزتِ <b>${ar(state.done)}</b> من <b>${ar(TOTAL)}</b> تحديًا بنجاح أو بمحاولتين.</p><button class="btn" data-act="advance">${last?'🏅 شاهدي شهادة الإنجاز':'🚢 إلى المحطة التالية'}</button></section>`)}
function finish(){state.finished=true;state.view='finish';const spent=state.elapsed;const winners=Math.max(...state.scores);let msg=state.dual?`الفريق المتألق: ${state.teams.filter((x,i)=>state.scores[i]===winners).map(esc).join(' و ')}`:`أحسنتِ يا ${esc(state.teams[0])}!`;shell(`<section class="deck trophy"><div class="ticon">🏆</div><h1>فتحتِ كنز الزمن!</h1><p>لقد أُصلِح تقويم الغواصة وعادت الرحلات إلى مواعيدها!<br><b>${msg}</b></p><div class="scores">${state.teams.map((name,i)=>`<div class="scorecard">${esc(name)}<b>${ar(state.scores[i])}</b>نقطة</div>`).join('')}</div><p>🐚 عدد المحطات: ${ar(STAGES.length)} · التحديات: ${ar(TOTAL)} · الزمن: ${timeFormat(spent)}</p><div class="actionstrip actions"><button class="btn" data-act="again">🔄 لعب من جديد</button><button class="btn alt" data-act="print">🖨️ اطبعي شهادة الإنجاز</button></div></section>`);tone('level');speak('مبارك! نجحتِ في إنقاذ تقويم الغواصة!')}

function start(){state.dual=document.getElementById('dual')?.checked||false;let n1=document.getElementById('player1')?.value.trim().slice(0,24)||'مستكشفة اللؤلؤ';let n2=document.getElementById('player2')?.value.trim().slice(0,24)||'فريق المرجان';state.teams=state.dual?[n1,n2]:[n1];state.scores=state.teams.map(()=>0);state.done=0;state.elapsed=0;state.stage=0;state.question=0;state.view='game';state.shuffledDays=shuffle(DOW);resetQuestion();if(ticker)clearInterval(ticker);ticker=setInterval(()=>{if(state.view!=='welcome'&&state.view!=='finish'&&!document.hidden){state.elapsed++;const c=document.getElementById('clock');if(c)c.textContent=timeFormat(state.elapsed)}},1000);tone('level');renderGame()}

document.getElementById('speakToggle').onclick=()=>{state.speech=!state.speech;document.getElementById('speakToggle').textContent=state.speech?'🎙️ النطق: يعمل':'🎙️ النطق: متوقف';if(!state.speech&&'speechSynthesis' in window)speechSynthesis.cancel();if(state.speech)speak('أهلًا بكِ في مغامرة أسرار التقويم!')};
